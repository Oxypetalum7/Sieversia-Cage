# バージョンは ADR-0003 で固定。上げる時は ADR を起こす。
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
remoteCompose = "1.0.0-alpha20"
remoteComposeFoundation = "1.0.0-alpha03"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
work = "2.12.0"
junit = "6.1.3"
kotest = "6.2.5"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
detekt = "1.23.8"
composeRulesDetekt = "0.4.28"
hilt = "2.60.1"
ksp = "2.3.12"
navigation = "2.10.2"
hiltAndroidx = "1.4.0"
kotlinxSerialization = "1.11.0"
# ADR-0018: アルバムの正のデータ
room3 = "3.0.3"
sqlite = "2.7.1"
# コルーチン本体は Room などから 1.9.0 が入る。テスト用もそれに揃える
kotlinxCoroutines = "1.9.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# M1 タスク3: MVI の ViewModel とそのテスト（ADR-0005）
timber = "5.0.1"
mockk = "1.14.11"
turbine = "1.2.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "hiltAndroidx" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
room3-testing = { module = "androidx.room3:room3-testing", version.ref = "room3" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

remote-core = { module = "androidx.compose.remote:remote-core", version.ref = "remoteCompose" }
remote-creation-android = { module = "androidx.compose.remote:remote-creation-android", version.ref = "remoteCompose" }
remote-creation-compose = { module = "androidx.compose.remote:remote-creation-compose", version.ref = "remoteCompose" }
remote-player-compose = { module = "androidx.compose.remote:remote-player-compose", version.ref = "remoteCompose" }
remote-player-core = { module = "androidx.compose.remote:remote-player-core", version.ref = "remoteCompose" }
remote-player-view = { module = "androidx.compose.remote:remote-player-view", version.ref = "remoteCompose" }
remote-foundation = { module = "androidx.compose.remote.foundation:foundation", version.ref = "remoteComposeFoundation" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "composeRulesDetekt" }

# build-logic（convention plugin）がコンパイル時に参照する Gradle プラグイン本体
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlintGradle" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
room3-gradle-plugin = { module = "androidx.room3:room3-gradle-plugin", version.ref = "room3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room3 = { id = "androidx.room3", version.ref = "room3" }

# build-logic の convention plugin（ADR-0017）
sieversia-jvm-library = { id = "sieversia.jvm.library" }
sieversia-android-library = { id = "sieversia.android.library" }
sieversia-android-application = { id = "sieversia.android.application" }
sieversia-android-compose = { id = "sieversia.android.compose" }
sieversia-android-hilt = { id = "sieversia.android.hilt" }
sieversia-android-room = { id = "sieversia.android.room" }
sieversia-android-feature = { id = "sieversia.android.feature" }
